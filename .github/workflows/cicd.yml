name: CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# A new push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------- BACKEND (Spring Boot + Maven) ----------------
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A throwaway MySQL so the Spring context can start during tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: authify_test
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_user_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci_root_pw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Names must match the ${...} placeholders in application.properties.
    # These are DUMMY values for tests only - nothing here is a real secret.
    env:
      DB_URL: jdbc:mysql://localhost:3306/authify_test
      DB_USERNAME: ci_user
      DB_PASSWORD: ci_user_pw
      JWT_SECRET_KEY: ciOnlyDummyJwtSecretKeyNotRealABCDEFGHIJKLMNOPQRSTUVWXYZ01234567
      SMTP_HOST: localhost
      SMTP_PORT: "2525"
      SMTP_USERNAME: ci-dummy-user
      SMTP_PASSWORD: ci-dummy-password
      SMTP_FROM: ci@example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # trimStackTrace=false makes the log show the full "Caused by" chain
      - name: Build and test with Maven
        run: mvn -B clean verify -Dsurefire.trimStackTrace=false

      # If tests fail, keep the detailed reports so you can download and read them
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

  # ---------------- FRONTEND (React + Vite) ----------------
  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ---------------- DEPLOY (only on push to main) ----------------
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    # Only deploy when code is pushed to main (not on pull requests)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Wait for both CI jobs to pass before deploying
    needs: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Connect GitHub Actions to your AWS account using the secrets you added
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Log in to ECR so Docker can push images there
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build the backend Docker image and push it to ECR
      # The image is tagged with the git commit SHA so every deploy is unique and traceable
      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ secrets.ECR_BACKEND_REPO }}:$IMAGE_TAG ./backend
          docker push $ECR_REGISTRY/${{ secrets.ECR_BACKEND_REPO }}:$IMAGE_TAG

      # Build the frontend Docker image and push it to ECR
      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ secrets.ECR_FRONTEND_REPO }}:$IMAGE_TAG ./frontend
          docker push $ECR_REGISTRY/${{ secrets.ECR_FRONTEND_REPO }}:$IMAGE_TAG

      # Download the current backend task definition from ECS as a JSON file
      - name: Download backend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ secrets.ECS_BACKEND_TASK_DEF }} \
            --query taskDefinition > /tmp/backend-task-def.json

      # Swap the new image into the backend task definition JSON
      - name: Render new backend task definition
        id: render-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/backend-task-def.json
          container-name: backend
          image: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_BACKEND_REPO }}:${{ github.sha }}

      # Deploy the updated backend task definition to ECS
      - name: Deploy backend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-backend.outputs.task-definition }}
          service: ${{ secrets.ECS_BACKEND_SERVICE }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true

      # Download the current frontend task definition from ECS as a JSON file
      - name: Download frontend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ secrets.ECS_FRONTEND_TASK_DEF }} \
            --query taskDefinition > /tmp/frontend-task-def.json

      # Swap the new image into the frontend task definition JSON
      - name: Render new frontend task definition
        id: render-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/frontend-task-def.json
          container-name: frontend
          image: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_FRONTEND_REPO }}:${{ github.sha }}

      # Deploy the updated frontend task definition to ECS
      - name: Deploy frontend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-frontend.outputs.task-definition }}
          service: ${{ secrets.ECS_FRONTEND_SERVICE }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true
