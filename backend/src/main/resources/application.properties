spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#helps to update/create the database tables
spring.jpa.hibernate.ddl-auto=update

jwt.secret.key=${JWT_SECRET_KEY}

#all the endpoints will be prepended with this
server.servlet.context-path=/api/v1


#Email service properties
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.email.smtp.auth=true
spring.mail.properties.email.smtp.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.properties.email.smtp.from=${SMTP_FROM}